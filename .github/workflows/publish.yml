name: Publish mujpy 

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        default: v3.1
        type: string
      destination:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.destination == 'testpypi' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Save distributions for testing and later PyPI publication
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mujpy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: ${{ inputs.destination == 'pypi' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mujpy
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11099840471'
          run-id: '36721247971'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
